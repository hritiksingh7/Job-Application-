 spring.application.name=dev

# config for db
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test
# SQL queries generated by hibernate will be showed in the logs
spring.jpa.show-sql=true           
# delete and create the table again     
spring.jpa.hibernate.ddl-auto=update

#actuator
management.endpoints.web.exposure.include=*
#health-actuator
management.endpoint.health.show-details=always
#info-actuator
management.info.env.enabled=true
info.app.name=JobApplication
info.app.description=Backend Job app built by Hritik w Faisal
info.app.version=1.0.0
#shutdown-actuator
management.endpoint.shutdown.access=unrestricted
server.shutdown=graceful